<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Second Brain · Agent City</title>
<meta name="theme-color" content="#05030c">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root{
  --bg:#05030c; --panel:rgba(14,10,28,.8); --line:rgba(200,150,255,.18); --text:#f0eaff; --muted:#9a8fbf;
  --skill:#ff7ad9; --agent:#b98cff; --job:#3ddc84; --tool:#f7c948; --topic:#8b97b8; --accent:#ff7ad9;
  --light:#4fd1ff; --standard:#b98cff; --heavy:#ffb547; --r:14px; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
#web{position:fixed;inset:0;touch-action:none;cursor:grab}
#web.drag{cursor:grabbing}
.glass{background:var(--panel);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--line);border-radius:var(--r)}
#top{position:fixed;left:16px;top:16px;display:flex;gap:12px;align-items:center;padding:10px 14px;z-index:5}
#top h1{margin:0;font-size:16px;letter-spacing:.28em;font-weight:700}
#top h1 span{color:var(--accent);text-shadow:0 0 12px var(--accent)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;color:var(--muted);text-decoration:none;font-size:13px}
.iconbtn:hover{color:var(--text);border-color:var(--accent)}
#legend{position:fixed;left:16px;bottom:16px;padding:8px 12px;z-index:5;display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--muted);max-width:calc(100vw - 440px)}
#legend button{background:none;border:0;padding:0;cursor:pointer;color:inherit;display:flex;align-items:center;gap:5px}
#legend button.off{opacity:.35}
#legend i{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 8px currentColor}
#panel{position:fixed;right:16px;top:16px;bottom:16px;width:400px;display:flex;flex-direction:column;z-index:5;overflow:hidden}
#panel header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#panel header p{margin:4px 0 0;font-size:12px;color:var(--muted);line-height:1.45}
.statrow{display:flex;gap:6px;margin-top:10px}
.stat{flex:1;border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center}
.stat b{display:block;font-size:17px;font-family:var(--mono)} .stat small{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em}
#search{margin-top:10px;width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:9px 10px;outline:none}
#search:focus,textarea:focus{border-color:var(--accent)}
#body{padding:14px 16px;overflow:auto;flex:1;line-height:1.5;font-size:14px}
h2{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;font-weight:500}
h2:first-child{margin-top:0}
.item{border:1px solid var(--line);border-radius:12px;padding:8px 11px;margin-bottom:6px;cursor:pointer;background:rgba(255,255,255,.02)}
.item:hover{border-color:var(--accent)}
.item b{font-weight:500;font-size:14px} .item small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.pill{font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid currentColor;text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:99px;padding:4px 10px;cursor:pointer;color:var(--muted)}
.chip:hover{color:var(--text);border-color:var(--accent)}
.md{font-size:13.5px} .md pre{background:rgba(0,0,0,.4);padding:10px;border-radius:8px;overflow:auto;font-size:12px}
.md code{font-family:var(--mono);font-size:12px;background:rgba(255,255,255,.06);padding:1px 4px;border-radius:4px} .md pre code{background:none;padding:0}
.md h2{font-size:12px;margin-top:14px} .md a{color:var(--accent)} .md table{border-collapse:collapse;font-size:12px} .md td,.md th{border-bottom:1px solid var(--line);padding:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.go{color:#fff;text-decoration:none;display:inline-block;background:linear-gradient(135deg,#ff5cc8,#7b5cff);border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 0 22px rgba(255,92,200,.3);font-size:13px}
.go:disabled{opacity:.5;cursor:default}
.ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--text);text-decoration:none;font-size:13px}
.ghost:hover{border-color:var(--accent)}
textarea{width:100%;min-height:78px;resize:vertical;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:10px;outline:none;line-height:1.45}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.hint code{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:5px}
.teach{border:1px solid rgba(255,122,217,.4);background:rgba(255,122,217,.06);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.empty{color:var(--muted);font-size:13px;line-height:1.5;padding:8px 2px}
#tip{position:fixed;pointer-events:none;z-index:6;padding:6px 10px;font-size:12px;display:none;max-width:280px}
#tip small{display:block;color:var(--muted);font-family:var(--mono);font-size:10.5px;margin-top:2px}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);padding:10px 16px;z-index:12;display:none;font-size:14px}
#toast.on{display:block}
@media (max-width: 820px){
  #panel{left:10px;right:10px;width:auto;top:auto;bottom:10px;height:46vh}
  #legend{bottom:calc(46vh + 20px);left:10px;max-width:calc(100vw - 20px)}
  #top{left:10px;top:10px}
}
</style>
</head>
<body>
<canvas id="web"></canvas>
<div id="top" class="glass"><a class="iconbtn" href="../" title="Back to the city">← City</a><h1>SECOND<span>BRAIN</span></h1></div>
<div id="legend" class="glass"></div>
<div id="tip" class="glass"></div>
<div id="toast" class="glass"></div>

<aside id="panel" class="glass">
  <header>
    <b style="font-size:15px">🧠 Everything the city knows</b>
    <p>Every skill the agents learned, the agents and tools that use them, and the jobs they came from. Agents read this before each job and add new skills when they figure something out.</p>
    <div class="statrow" id="stats"></div>
    <input id="search" type="text" placeholder="Search skills, jobs, agents, tools…" autocomplete="off">
  </header>
  <div id="body"><div class="empty">Waking up the brain…</div></div>
</aside>

<script>
(() => {
/* ------------------------------------------------------------------ config (shared with the city page) */
const store = { get(k){ try { return localStorage.getItem('agentcity.'+k) || ''; } catch { return ''; } } };
function detectRepo(){
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  if (m) { const seg = location.pathname.split('/').filter(Boolean)[0]; return { owner:m[1], repo: seg && seg !== 'brain' ? seg : `${m[1]}.github.io` }; }
  return null;
}
const d0 = detectRepo();
const cfg = { owner: store.get('owner') || d0?.owner || '', repo: store.get('repo') || d0?.repo || '', token: store.get('token') };
const connected = () => !!(cfg.owner && cfg.repo);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => (window.DOMPurify && window.marked) ? DOMPurify.sanitize(marked.parse(s || '')) : `<pre>${esc(s)}</pre>`;
function toast(msg, ms=4000){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms); }

const TYPES = {
  skill: { c:'#ff7ad9', name:'Skills' }, agent: { c:'#b98cff', name:'Agents' }, tool: { c:'#f7c948', name:'Tools' },
  job: { c:'#3ddc84', name:'Jobs (history)' }, topic: { c:'#8b97b8', name:'Topics' },
};
const MODEL_C = { haiku:'#4fd1ff', sonnet:'#b98cff', opus:'#ffb547' };
const colorOf = n => n.type === 'agent' ? (MODEL_C[n.model] || TYPES.agent.c) : TYPES[n.type]?.c || '#fff';
const hidden = new Set();

/* ------------------------------------------------------------------ data */
async function ghFile(path){
  const headers = { Accept:'application/vnd.github.raw+json' };
  if (cfg.token) headers.Authorization = `Bearer ${cfg.token}`;
  const r = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`, { headers, cache:'no-store' });
  if (!r.ok) throw new Error('GitHub ' + r.status);
  return r.text();
}
async function loadBrain(){
  if (connected()) {   // freshest copy: straight from the repo (GitHub Pages can lag a minute behind)
    try { return JSON.parse(await ghFile('brain/brain.json')); } catch {}
    try { const r = await fetch(`https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/HEAD/brain/brain.json`, { cache:'no-store' }); if (r.ok) return await r.json(); } catch {}
  }
  const r = await fetch('brain.json', { cache:'no-store' });
  if (!r.ok) throw new Error('brain.json ' + r.status);
  return r.json();
}

let brain = null, nodes = [], links = [], byId = {}, selected = null, hover = null;
function prepare(data){
  brain = data;
  nodes = data.nodes.map(n => ({ ...n, x:0, y:0, vx:0, vy:0, deg:0, nb:[] }));
  byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  links = data.links.filter(l => byId[l.source] && byId[l.target]).map(l => ({ ...l, s: byId[l.source], t: byId[l.target] }));
  links.forEach(l => { l.s.deg++; l.t.deg++; l.s.nb.push({ n:l.t, kind:l.kind }); l.t.nb.push({ n:l.s, kind:l.kind }); });
  const ring = { agent:.25, skill:.55, topic:.7, tool:.85, job:.95 };
  const groups = {}; nodes.forEach(n => (groups[n.type] ||= []).push(n));
  Object.entries(groups).forEach(([type, list]) => list.forEach((n, i) => {
    const a = i / list.length * Math.PI * 2 + (ring[type] || 1) * 3, r = (ring[type] || 1) * 260;
    n.x = Math.cos(a) * r * 1.25; n.y = Math.sin(a) * r * .85;
  }));
  nodes.forEach(n => n.r = n.type === 'agent' ? 10 + Math.sqrt(n.uses || 0) * 2.5 : n.type === 'skill' ? 7 + Math.min(n.deg, 14) * .35 : n.type === 'tool' ? 6 : n.type === 'topic' ? 4.5 : 5);
  alpha = 1;
}

/* ------------------------------------------------------------------ canvas + physics */
const cv = $('#web'), g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, view = { x:0, y:0, k:1 }, alpha = 1;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const panelW = W > 820 ? 420 : 0, panelH = W > 820 ? 0 : H * .46;
  view.cx = (W - panelW) / 2; view.cy = (H - panelH) / 2;
  view.k = Math.max(.35, Math.min(1.2, Math.min((W - panelW) / 900, (H - panelH) / 640)));
}
addEventListener('resize', resize); resize();
const lobe = () => ({ rx: 420, ry: 300 });   // the brain-shaped area nodes live in (world units)

function step(){
  if (alpha < .004) return;
  const N = nodes.length, live = nodes.filter(n => !hidden.has(n.type));
  for (let i = 0; i < live.length; i++) for (let j = i + 1; j < live.length; j++) {
    const a = live[i], b = live[j]; let dx = a.x - b.x, dy = a.y - b.y, d2 = dx*dx + dy*dy;
    if (d2 > 90000) continue; if (d2 < 1) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
    const f = 1400 * alpha / d2; a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
  }
  for (const l of links) {
    if (hidden.has(l.s.type) || hidden.has(l.t.type)) continue;
    const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y, d = Math.sqrt(dx*dx + dy*dy) || 1;
    const rest = l.kind === 'related' ? 70 : l.kind === 'topic' ? 55 : l.kind === 'done by' ? 95 : 85;
    const hub = Math.max(1, Math.min(l.s.deg, l.t.deg));
    const f = (d - rest) / d * .045 * alpha / Math.sqrt(hub);
    l.s.vx += dx * f; l.s.vy += dy * f; l.t.vx -= dx * f; l.t.vy -= dy * f;
  }
  const { rx, ry } = lobe();
  for (const n of live) {
    if (n === drag?.node) { n.vx = n.vy = 0; continue; }
    n.vx -= n.x * .004 * alpha; n.vy -= n.y * .004 * alpha;
    const e = (n.x / rx) ** 2 + (n.y / ry) ** 2;            // keep the web inside the skull
    if (e > 1) { n.vx -= n.x * (e - 1) * .03; n.vy -= n.y * (e - 1) * .03; }
    if (Math.abs(n.x) < 14 && n.type !== 'agent') n.vx += Math.sign(n.x || 1) * .4 * alpha;   // the gap between the two halves
    n.vx *= .82; n.vy *= .82; n.x += n.vx; n.y += n.vy;
  }
  alpha *= .992; if (N === 0) alpha = 0;
}

const sparks = [];
function drawBrainShell(t){
  const { rx, ry } = lobe();
  g.save(); g.lineWidth = 1.2 / view.k;
  for (const side of [-1, 1]) {   // two hemispheres with a few gyri curves
    g.beginPath(); g.ellipse(side * rx * .5, 0, rx * .56, ry * 1.04, 0, 0, Math.PI * 2);
    const grd = g.createRadialGradient(side * rx * .5, -ry * .2, 10, side * rx * .5, 0, rx * .7);
    grd.addColorStop(0, 'rgba(255,122,217,.07)'); grd.addColorStop(1, 'rgba(120,80,255,.015)');
    g.fillStyle = grd; g.fill(); g.strokeStyle = 'rgba(255,122,217,.16)'; g.stroke();
    g.strokeStyle = 'rgba(185,140,255,.07)';
    for (let k = 1; k <= 4; k++) {
      g.beginPath();
      for (let a = -Math.PI * .9; a <= Math.PI * .9; a += .06) {
        const rr = 1 - k * .17 + Math.sin(a * 7 + k * 1.3 + t * .2) * .025;
        const x = side * rx * .5 + Math.cos(a) * rx * .56 * rr * side, y = Math.sin(a) * ry * 1.04 * rr;
        a === -Math.PI * .9 ? g.moveTo(x, y) : g.lineTo(x, y);
      }
      g.stroke();
    }
  }
  g.restore();
}
function frame(now){
  requestAnimationFrame(frame);
  const t = now / 1000;
  step();
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#05030c'; g.fillRect(0, 0, W, H);
  const bg = g.createRadialGradient(view.cx, view.cy, 20, view.cx, view.cy, Math.max(W, H) * .7);
  bg.addColorStop(0, 'rgba(90,40,140,.22)'); bg.addColorStop(1, 'rgba(5,3,12,0)'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.setTransform(DPR * view.k, 0, 0, DPR * view.k, DPR * (view.cx + view.x), DPR * (view.cy + view.y));
  drawBrainShell(t);
  const focus = selected || hover, near = new Set(focus ? [focus, ...focus.nb.map(x => x.n)] : []);
  const q = $('#search').value.trim().toLowerCase(), match = q ? new Set(nodes.filter(n => hay(n).includes(q))) : null;
  // links
  for (const l of links) {
    if (hidden.has(l.s.type) || hidden.has(l.t.type)) continue;
    const on = focus && (l.s === focus || l.t === focus);
    g.strokeStyle = on ? hexA(colorOf(focus), .75) : focus || match ? 'rgba(160,140,220,.05)' : 'rgba(160,140,220,.16)';
    g.lineWidth = (on ? 1.6 : .8) / Math.sqrt(view.k);
    g.beginPath(); g.moveTo(l.s.x, l.s.y);
    const mx = (l.s.x + l.t.x) / 2, my = (l.s.y + l.t.y) / 2, bend = .12;
    g.quadraticCurveTo(mx - (l.t.y - l.s.y) * bend, my + (l.t.x - l.s.x) * bend, l.t.x, l.t.y); g.stroke();
  }
  // synapse sparks travelling along links
  if (links.length && sparks.length < 40 && Math.random() < .5) {
    const pool = focus ? links.filter(l => l.s === focus || l.t === focus) : links;
    const l = pool[(Math.random() * pool.length) | 0];
    if (l && !hidden.has(l.s.type) && !hidden.has(l.t.type)) sparks.push({ l, p:0, v:.006 + Math.random() * .012, back: Math.random() < .5 });
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.p += s.v; if (s.p >= 1) { sparks.splice(i, 1); continue; }
    const a = s.back ? s.l.t : s.l.s, b = s.back ? s.l.s : s.l.t, p = s.p;
    const mx = (s.l.s.x + s.l.t.x) / 2 - (s.l.t.y - s.l.s.y) * .12, my = (s.l.s.y + s.l.t.y) / 2 + (s.l.t.x - s.l.s.x) * .12;
    const x = (1-p)*(1-p)*a.x + 2*(1-p)*p*mx + p*p*b.x, y = (1-p)*(1-p)*a.y + 2*(1-p)*p*my + p*p*b.y;
    g.fillStyle = `rgba(255,220,250,${Math.sin(p * Math.PI) * .9})`; g.beginPath(); g.arc(x, y, 1.8 / Math.sqrt(view.k), 0, Math.PI * 2); g.fill();
  }
  // nodes
  for (const n of nodes) {
    if (hidden.has(n.type)) continue;
    const dim = (focus && !near.has(n)) || (match && !match.has(n));
    const c = colorOf(n), pulse = n === selected ? 1 + Math.sin(t * 5) * .15 : 1;
    g.globalAlpha = dim ? .18 : 1;
    g.shadowColor = c; g.shadowBlur = dim ? 0 : (n.type === 'agent' || n === focus ? 22 : 10);
    g.fillStyle = n.type === 'job' || n.type === 'topic' ? hexA(c, .85) : c;
    g.beginPath();
    if (n.type === 'tool') { const r = n.r * pulse; g.rect(n.x - r, n.y - r, r * 2, r * 2); }
    else if (n.type === 'skill') { const r = n.r * pulse; for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2 + Math.PI / 6; k ? g.lineTo(n.x + Math.cos(a) * r, n.y + Math.sin(a) * r) : g.moveTo(n.x + Math.cos(a) * r, n.y + Math.sin(a) * r); } g.closePath(); }
    else g.arc(n.x, n.y, n.r * pulse, 0, Math.PI * 2);
    g.fill(); g.shadowBlur = 0;
    if (n === selected) { g.strokeStyle = '#fff'; g.lineWidth = 2 / view.k; g.beginPath(); g.arc(n.x, n.y, n.r + 5, 0, Math.PI * 2); g.stroke(); }
    const showLabel = !dim && (n.type === 'agent' || near.has(n) || (match && match.has(n)) || (n.type === 'skill' && view.k > .55) || view.k > 1.5);
    if (showLabel) {
      const fs = (n.type === 'agent' ? 13 : 11) / Math.sqrt(view.k);
      g.font = `${n.type === 'agent' ? 700 : 500} ${fs}px Space Grotesk, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'top';
      const label = n.label.length > 34 ? n.label.slice(0, 32) + '…' : n.label;
      g.fillStyle = 'rgba(5,3,12,.7)'; const w = g.measureText(label).width; g.fillRect(n.x - w/2 - 3, n.y + n.r + 3, w + 6, fs + 4);
      g.fillStyle = n.type === 'agent' ? c : '#efe6ff'; g.fillText(label, n.x, n.y + n.r + 5);
    }
    g.globalAlpha = 1;
  }
}
function hexA(hex, a){ const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
const hay = n => `${n.label} ${n.summary || ''} ${n.type} ${(n.tags || []).join(' ')} ${n.body || ''}`.toLowerCase();

/* ------------------------------------------------------------------ pointer: pan, zoom, drag, pick */
const toWorld = (sx, sy) => ({ x: (sx - view.cx - view.x) / view.k, y: (sy - view.cy - view.y) / view.k });
function pickAt(sx, sy){
  const p = toWorld(sx, sy); let best = null, bd = Infinity;
  for (const n of nodes) { if (hidden.has(n.type)) continue; const d = Math.hypot(n.x - p.x, n.y - p.y); if (d < n.r + 8 / view.k && d < bd) { best = n; bd = d; } }
  return best;
}
const pointers = new Map(); let drag = null, pinch = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k }; drag = null; return; }
  const n = pickAt(e.clientX, e.clientY);
  drag = { node:n, sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y, moved:false }; cv.classList.add('drag');
});
cv.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pinch && pointers.size === 2) { const [a, b] = [...pointers.values()]; view.k = clampK(pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d); return; }
  if (drag) {
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy; if (Math.hypot(dx, dy) > 4) drag.moved = true;
    if (drag.node) { const p = toWorld(e.clientX, e.clientY); drag.node.x = p.x; drag.node.y = p.y; alpha = Math.max(alpha, .3); }
    else { view.x = drag.vx + dx; view.y = drag.vy + dy; }
    return;
  }
  const n = pickAt(e.clientX, e.clientY); hover = n; cv.style.cursor = n ? 'pointer' : '';
  const tip = $('#tip');
  if (n && e.pointerType === 'mouse') { tip.innerHTML = `<b>${esc(n.label)}</b><small>${esc(TYPES[n.type]?.name.replace(/s?( \(.*\))?$/, '') || n.type)}${n.summary ? ' · ' + esc(n.summary.slice(0, 90)) : ''}</small>`; tip.style.display = 'block'; tip.style.left = Math.min(e.clientX + 14, W - 290) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; }
  else tip.style.display = 'none';
});
function endPointer(e){
  pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null;
  if (drag && !drag.moved && (drag.node || selected)) select(drag.node || null);
  drag = null; cv.classList.remove('drag');
}
cv.addEventListener('pointerup', endPointer); cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', () => { hover = null; $('#tip').style.display = 'none'; });
const clampK = k => Math.max(.2, Math.min(4, k));
cv.addEventListener('wheel', e => {
  e.preventDefault(); const before = toWorld(e.clientX, e.clientY);
  view.k = clampK(view.k * Math.exp(-e.deltaY * .0015));
  view.x = e.clientX - view.cx - before.x * view.k; view.y = e.clientY - view.cy - before.y * view.k;
}, { passive:false });
function centerOn(n){ view.x = -n.x * view.k; view.y = -n.y * view.k; }

/* ------------------------------------------------------------------ panel */
function stats(){
  const c = brain?.counts || {};
  $('#stats').innerHTML = [['skills', c.skills], ['agents', c.agents], ['tools', c.tools], ['jobs', c.jobs], ['links', c.links]]
    .map(([k, v]) => `<div class="stat"><b>${v ?? 0}</b><small>${k}</small></div>`).join('');
}
function legend(){
  $('#legend').innerHTML = Object.entries(TYPES).map(([k, v]) => `<button data-t="${k}" class="${hidden.has(k) ? 'off' : ''}" title="Show / hide"><i style="color:${v.c};background:${v.c}"></i>${v.name}</button>`).join('');
  $('#legend').querySelectorAll('button').forEach(b => b.onclick = () => { const t = b.dataset.t; hidden.has(t) ? hidden.delete(t) : hidden.add(t); if (selected && hidden.has(selected.type)) select(null); alpha = Math.max(alpha, .4); legend(); });
}
const itemHTML = n => `<div class="item" data-id="${esc(n.id)}"><b style="color:${colorOf(n)}">${n.type === 'skill' ? '⬡ ' : ''}${esc(n.label)}</b><small>${esc(n.summary || '')}</small></div>`;
function wireItems(root){ root.querySelectorAll('.item[data-id], .chip[data-id]').forEach(el => el.onclick = () => { const n = byId[el.dataset.id]; if (n) { select(n); centerOn(n); } }); }
function fileUrl(path){
  if (!path || !connected()) return null;
  return `https://github.com/${cfg.owner}/${cfg.repo}/${path.endsWith('/') ? 'tree' : 'blob'}/HEAD/${path}`;
}
function home(){
  const q = $('#search').value.trim().toLowerCase();
  const list = q ? nodes.filter(n => !hidden.has(n.type) && hay(n).includes(q)) : nodes.filter(n => n.type === 'skill');
  list.sort((a, b) => (a.type === 'skill' ? 0 : 1) - (b.type === 'skill' ? 0 : 1) || a.label.localeCompare(b.label));
  const recent = nodes.filter(n => n.type === 'job').sort((a, b) => b.n - a.n).slice(0, 6);
  $('#body').innerHTML = `
    <div class="teach">
      <b>✨ Teach it something</b>
      <p class="hint" style="margin:4px 0 8px">Describe a skill (“how to turn a CSV into a chart page”, “how I like my weekly reports”). Scribe writes it into the brain as a new skill every agent can use.</p>
      <textarea id="lesson" placeholder="e.g. When I ask for a workout plan, always include warm-ups and a printable checklist."></textarea>
      <div class="actions"><button class="go" id="teachBtn">🧠 Add to the brain</button><button class="ghost" id="dreamBtn" title="Let it review its own history and invent a new skill">💭 Let it dream</button></div>
      <p class="hint" style="margin:0">It also learns by itself: after every job the agent saves any new method it worked out, and every Sunday it “dreams”: reviews the week and adds a skill of its own.</p>
    </div>
    <h2>${q ? `Matches (${list.length})` : `The library · ${list.length} skills`}</h2>
    ${list.length ? list.map(itemHTML).join('') : '<div class="empty">Nothing matches that yet. Teach it!</div>'}
    ${q ? '' : `<h2>Latest memories</h2>${recent.map(itemHTML).join('') || '<div class="empty">No jobs yet.</div>'}`}
    ${brain?.problems?.length ? `<h2>Loose ends</h2><div class="hint">${brain.problems.map(esc).join('<br>')}</div>` : ''}
    <p class="hint" style="margin-top:14px">Drag to pan, scroll or pinch to zoom, drag a node to move it, click one to open it. Updated ${esc(brain?.generated ? new Date(brain.generated).toLocaleString() : '?')}.</p>`;
  wireItems($('#body'));
  const lesson = $('#lesson'); lesson.value = lessonDraft; lesson.oninput = () => lessonDraft = lesson.value;
  $('#teachBtn').onclick = teach; $('#dreamBtn').onclick = dream;
}
let lessonDraft = '';
function select(n){
  selected = n; $('#tip').style.display = 'none';
  if (!n) { home(); return; }
  const kindName = { skill:'skill', agent:'agent', tool:'tool', job:'memory · job', topic:'topic' }[n.type] || n.type;
  const acts = [];
  const url = fileUrl(n.path); if (url) acts.push(`<a class="ghost" href="${esc(url)}" target="_blank" rel="noopener">Open file ↗</a>`);
  if (n.type === 'job' && n.has_page) acts.push(`<a class="go" href="../outputs/job-${n.n}/">▶ Open it</a>`);
  if (n.type === 'job' && n.has_model) acts.push(`<a class="go" href="../cad/?job=${n.n}">🧊 CAD Studio</a>`);
  if (n.type === 'skill') acts.push(`<button class="ghost" id="improveBtn">✏️ Improve this skill</button>`);
  const groups = {};
  n.nb.forEach(({ n:m, kind }) => (groups[kind] ||= []).push(m));
  const nbHTML = Object.entries(groups).map(([kind, list]) => `<h2>${esc(kind)}</h2><div class="chips">${list.map(m => `<button class="chip" data-id="${esc(m.id)}" style="color:${colorOf(m)}">${esc(m.label.length > 40 ? m.label.slice(0, 38) + '…' : m.label)}</button>`).join('')}</div>`).join('');
  $('#body').innerHTML = `<button class="iconbtn" id="backBtn">← Library</button>
    <h2 style="margin-top:12px"><span class="pill" style="color:${colorOf(n)}">${esc(kindName)}</span>${n.type === 'agent' ? ` <span class="pill" style="color:${colorOf(n)}">${esc(n.model)} · ${n.uses || 0} jobs</span>` : ''}</h2>
    <div style="font-size:18px;font-weight:700;color:${colorOf(n)};line-height:1.3">${esc(n.label)}</div>
    ${n.summary ? `<p class="hint" style="margin:4px 0 0">${esc(n.summary)}</p>` : ''}
    ${acts.length ? `<div class="actions">${acts.join('')}</div>` : ''}
    ${nbHTML}
    ${n.body ? `<h2>${n.type === 'job' ? 'What was made' : n.type === 'agent' ? 'How it thinks' : 'How'}</h2><div class="md">${md(n.body)}</div>` : ''}`;
  $('#backBtn').onclick = () => select(null);
  wireItems($('#body'));
  const ib = $('#improveBtn'); if (ib) ib.onclick = () => { lessonDraft = `Improve the skill "${n.label}" (brain/skills/${n.id.slice(6)}.md): `; select(null); $('#lesson').focus(); };
}
let searchT; $('#search').addEventListener('input', () => { clearTimeout(searchT); searchT = setTimeout(() => { if (!selected) home(); }, 150); });

/* ------------------------------------------------------------------ teaching = a normal city job for Scribe */
async function sendIssue(title, body){
  if (!connected()) { toast('Connect your repo in the city first (⚙ Settings). Opening it…', 5000); setTimeout(() => location.href = '../#settings', 1400); return null; }
  if (cfg.token) {
    const r = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/issues`, { method:'POST', headers:{ Accept:'application/vnd.github+json', Authorization:`Bearer ${cfg.token}`, 'Content-Type':'application/json' }, body: JSON.stringify({ title, body }) });
    if (!r.ok) throw new Error(r.status === 403 ? 'token can’t create issues' : 'GitHub ' + r.status);
    return 'sent';
  }
  window.open(`https://github.com/${cfg.owner}/${cfg.repo}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`, '_blank', 'noopener');
  return 'opened';
}
const HEAD = 'Agent: scribe\nMode: make\n<!-- sent from Agent City (Second Brain) -->\n\n';
const SKILL_RULES = 'Save it as brain/skills/<kebab-slug>.md using the exact format in brain/skills/learn-a-skill.md, with `related` pointing at real skills from brain/INDEX.md. If a skill on the same thing already exists, improve that file instead of adding a twin. Write a practical, reusable method (steps, commands, gotchas), not a one-off answer. In the README, name the skill file you wrote and summarize it in 2-3 lines.';
async function teach(){
  const text = $('#lesson').value.trim();
  if (!text) { toast('Write what it should learn first.'); return; }
  const b = $('#teachBtn'); b.disabled = true; b.textContent = 'Sending…';
  try {
    const how = await sendIssue(`[city] 🧠 Learn: ${text.split('\n')[0].slice(0, 70)}${text.length > 70 ? '…' : ''}`,
      `${HEAD}Brain lesson: teach the city's second brain this skill.\n\n<<<\n${text}\n>>>\n\n${SKILL_RULES}`);
    if (how === 'sent') { toast('🧠 Lesson sent. It shows up as a new node in a few minutes.', 6000); $('#lesson').value = lessonDraft = ''; }
    else if (how === 'opened') toast('GitHub opened in a new tab: click “Create” and Scribe writes the skill.', 6000);
  } catch (e) { toast('Could not send: ' + e.message, 6000); }
  b.disabled = false; b.textContent = '🧠 Add to the brain';
}
async function dream(){
  if (!confirm('Let the brain dream now? It runs one small Scribe (Haiku) job that reviews recent jobs and adds or improves a skill.')) return;
  try {
    const how = await sendIssue('[city] 🧠 Brain dream: learn from recent jobs',
      `${HEAD}Brain dream. Review what the city did recently: the newest outputs/job-*/README.md files (especially any "Skill learned:" notes), brain/INDEX.md and the skills in brain/skills/. Then add 1-2 skills the brain is missing, or improve the weakest existing skill with what the jobs showed. Be creative: one of them may be a new technique you invent by combining tools and skills the city already has, as long as it is practical. ${SKILL_RULES}`);
    if (how === 'sent') toast('💭 Dreaming… a new skill appears in a few minutes.', 6000);
    else if (how === 'opened') toast('GitHub opened in a new tab: click “Create” to start the dream.', 6000);
  } catch (e) { toast('Could not send: ' + e.message, 6000); }
}

/* ------------------------------------------------------------------ go */
legend();
requestAnimationFrame(frame);
loadBrain().then(data => {
  prepare(data); stats();
  const want = decodeURIComponent(location.hash.slice(1)); if (want && byId[want]) select(byId[want]); else home();
}).catch(e => {
  stats();
  $('#body').innerHTML = `<div class="empty">The brain hasn’t been built yet (${esc(e.message)}). It’s made by <code>python3 scripts/brain.py</code>, which the city runs after every job.</div>`;
});
setInterval(() => { if (document.hidden || drag) return; loadBrain().then(d => { if (d.generated !== brain?.generated) { const keep = Object.fromEntries(nodes.map(n => [n.id, n])); const sel = selected?.id; prepare(d); nodes.forEach(n => { const o = keep[n.id]; if (o) { n.x = o.x; n.y = o.y; } }); alpha = .3; stats(); if (sel && byId[sel]) select(byId[sel]); else select(null); toast('🧠 The brain learned something new.'); } }).catch(() => {}); }, 5 * 60e3);
})();
</script>
