# Agent City job runner. Runs on GitHub's servers, so your computer can be off.
# Trigger: an issue titled "[city] ..." or labelled city-job (the 3D city creates these for you),
#          or add the `run-again` label to retry one.
# Needs ONE repo secret (Settings > Secrets and variables > Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  - uses your Claude Pro/Max plan. Get it by running `claude setup-token`.
#   or ANTHROPIC_API_KEY     - pay-per-use API key from console.anthropic.com.
name: city-job
on:
  issues:
    types: [opened, labeled]
  workflow_call:          # used by city-schedule.yml for recurring jobs
    inputs:
      issue_number: { type: string, required: true }
      issue_title: { type: string, required: true }
      issue_body: { type: string, required: true }

permissions:
  contents: write
  issues: write
  pull-requests: write    # upgrade mode delivers changes as a pull request

jobs:
  work:
    # Only YOU can spend your usage: issues from anyone else are ignored.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      github.event.issue.user.login == github.repository_owner &&
      (
        (github.event.action == 'opened' &&
          (startsWith(github.event.issue.title, '[city]') || contains(github.event.issue.labels.*.name, 'city-job'))) ||
        (github.event.action == 'labeled' && github.event.label.name == 'run-again')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: city-job-${{ inputs.issue_number || github.event.issue.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
      ISSUE_TITLE: ${{ inputs.issue_title || github.event.issue.title }}
      ISSUE_BODY: ${{ inputs.issue_body || github.event.issue.body }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Do the job
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # optional connections (see scripts/city_connect.py); each is off until its secret exists
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          CITY_MCP_SERVERS: ${{ secrets.CITY_MCP_SERVERS }}
        run: |
          # pasted tokens often pick up line breaks/spaces from terminal wrapping; strip them
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          export ANTHROPIC_API_KEY="$(printf '%s' "$ANTHROPIC_API_KEY" | tr -d '[:space:]')"
          # an unset secret arrives as an empty string; drop it so it can't shadow the other one
          [ -z "$ANTHROPIC_API_KEY" ] && unset ANTHROPIC_API_KEY
          [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && unset CLAUDE_CODE_OAUTH_TOKEN
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "No Claude secret found" > "$RUNNER_TEMP/city-error.txt"; exit 1
          fi
          claude --version
          python3 scripts/city_job.py run
      - name: Save the results (or open an upgrade pull request)
        run: python3 scripts/city_job.py save
      - name: Report back on the issue
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/city_job.py finish
      - name: Report failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/city_job.py fail
